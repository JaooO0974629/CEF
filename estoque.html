<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEF</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/estoque.css">
</head>
<body>
    <header>
        <h1>CEF</h1>
        <nav>
            <ul>
                <li><a href="index.html">Alocação</a></li>
                <li><a href="relatorios.html">Histórico</a></li>
                <li class="nav-ativo"><a href="estoque.html">Estoque</a></li>
                <li><a href="perfis.html">Perfis</a></li>
            </ul>
        </nav>
        <a href="login.html">
            <img class="logout" src="img/logout.png" alt="Sair">
        </a>
    </header>
    <main>
        <div class="top_buttons">
            <button id="btn-nova-ferramenta" class="botao botao--primario botao--largo">Nova Ferramenta</button>
            <input class="pesq" type="text" placeholder="Pesquisa...">
        </div>
        <div class="tabela-wrapper">
            <div class="tabela-card">
                <table class="tabela-estoque">
                    <thead>
                        <tr class="tabela-titulo">
                            <th colspan="5">Ferramentas em Estoque</th>
                        </tr>
                        <tr class="tabela-cabecalho">
                            <th>Ferramenta</th>
                            <th>ID</th>
                            <th>Quantidade em Estoque</th>
                            <th>Quantidade Total</th>
                            <th>Necessita Manutenção</th>
                        </tr>
                    </thead>
                    <tbody id="lista-estoque">
                        <tr>
                            <td>Chave de Fenda</td>
                            <td>12345</td>
                            <td>10</td>
                            <td>15</td>
                            <td>3</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="modal-overlay" class="modal-overlay">
        <form id="form-nova-ferramenta" class="modal">
            <h2>Nova Ferramenta</h2><br>

            <div class="campo-formulario">
                <label for="ferramenta">Ferramenta</label>
                <input id="ferramenta" type="text" name="ferramenta" required placeholder="Insira a ferramenta...">
            </div>

            <div class="campo-formulario">
                <label for="id">ID</label>
                <input id="id" type="text" name="id" required placeholder="Insira o ID...">
            </div>

            <div class="campo-formulario">
                <label for="estoque">Quantidade em Estoque</label>
                <input id="estoque" type="number" name="estoque" required placeholder="Insira a quantidade em estoque...">
            </div>

            <div class="campo-formulario">
                <label for="total">Quantidade Total</label>
                <input id="total" type="number" name="total" required placeholder="Insira a quantidade total...">
            </div>

            <div class="campo-formulario">
                <label for="manutencao">Necessita Manutenção</label>
                <input id="manutencao" type="number" name="manutencao" required placeholder="Quantas necessitam manutenção...">
            </div>

            <div class="campo-formulario">
                <label for="fornecedor">Selecione um Fornecedor</label>
                <div class="fornecedor-controle">
                    <select id="fornecedor" name="fornecedor" required>

                    </select>
                    <button id="btn-novo-fornecedor" class="botao-adicionar-fornecedor" type="button" aria-label="Adicionar fornecedor" title="Adicionar fornecedor">+</button>
                </div>  
            </div>

            <div class="modal-acoes">
                <button id="btn-cancelar" type="button" class="botao botao--secundario">Cancelar</button>
                <button id="btn-adicionar" type="submit" class="botao botao--primario">Adicionar</button>
            </div>
        </form>
    </div>

    <div id="modal-fornecedor-overlay" class="modal-overlay">
        <form id="form-novo-fornecedor" class="modal modal--fornecedor">
            <h2>Novo Fornecedor</h2><br>

            <div class="campo-formulario">
                <label for="nome-fornecedor">Nome do Fornecedor</label>
                <input id="nome-fornecedor" name="nome" type="text" required placeholder="Insira o nome do fornecedor...">
            </div>

             <div class="campo-formulario">
                <label for="cnpj-fornecedor">CNPJ do Fornecedor</label>
                <input id="cnpj-fornecedor" name="cnpj" inputmode="numeric" maxlength="18" minlength="14" type="text" required placeholder="00.000.000/0000-00">
            </div>

            <div class="campo-formulario">
                <label for="telefone-fornecedor">Telefone do Fornecedor</label>
                <input id="telefone-fornecedor" name="telefone" inputmode="tel" type="tel" autocomplete="tel" required placeholder="(00) 00000-0000">       
            </div>

            <div class="campo-formulario">
                <label for="email-fornecedor">Email do Fornecedor</label>
                <input id="email-fornecedor" name="email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required placeholder="contato@empresa.com">            
            </div>


            <div class="modal-acoes">
                <button id="btn-cancelar-fornecedor" type="button" class="botao botao--secundario">Cancelar</button>
                <button type="submit" class="botao botao--primario">Adicionar</button>
            </div>
        </form>
    </div>

    <script src="js/estoque.js"></script>
</body>
</html>
