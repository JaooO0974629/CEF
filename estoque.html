<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEF</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/estoque.css">
</head>
<body>
    <header>
        <h1>CEF</h1>
        <nav>
            <ul>
                <li><a href="index.html">Empréstimos</a></li>
                <li><a href="relatorios.html">Relatórios</a></li>
                <li class="nav-ativo"><a href="estoque.html">Estoque</a></li>
                <li><a href="perfis.html">Perfis</a></li>
            </ul>
        </nav>
        <a href="login.html">
            <img class="logout" src="img/logout.png" alt="Sair">
        </a>
    </header>
    <main>
        <div class="top_buttons">
            <button id="btn-nova-ferramenta" class="botao botao--primario botao--largo">Nova Ferramenta</button>
            <input class="pesq" type="text" placeholder="Pesquisa...">
        </div>
        <div class="indicadores">
            <div class="indicador-card">
                <h2>Indicador</h2>
            </div>
            <div class="indicador-card">
                <h2>Indicador 2</h2>
            </div>
            <div class="indicador-card">
                <h2>Indicador 3</h2>
            </div>
            <div class="indicador-card">
                <h2>Indicador 4</h2>
            </div>
        </div>
        <div class="tabela-wrapper">
            <div class="tabela-card">
                <table class="tabela-estoque">
                    <thead>
                        <tr class="tabela-titulo">
                            <th colspan="5">Ferramentas em Estoque</th>
                        </tr>
                        <tr class="tabela-cabecalho">
                            <th>Ferramenta</th>
                            <th>ID</th>
                            <th>Quantidade em Estoque</th>
                            <th>Quantidade Total</th>
                            <th>Necessita Manutenção</th>
                        </tr>
                    </thead>
                    <tbody id="lista-estoque">
                        <tr>
                            <td>Chave de Fenda</td>
                            <td>12345</td>
                            <td>10</td>
                            <td>15</td>
                            <td>3</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="modal-overlay" class="modal-overlay">
        <form id="form-nova-ferramenta" class="modal">
            <h2>Nova Ferramenta</h2><br>

            <div class="campo-formulario">
                <label for="ferramenta">Ferramenta</label>
                <input id="ferramenta" type="text" name="ferramenta" required placeholder="Insira a ferramenta...">
            </div>

            <div class="campo-formulario">
                <label for="id">ID</label>
                <input id="id" type="text" name="id" required placeholder="Insira o ID...">
            </div>

            <div class="campo-formulario">
                <label for="estoque">Quantidade em Estoque</label>
                <input id="estoque" type="number" name="estoque" required placeholder="Insira a quantidade em estoque...">
            </div>

            <div class="campo-formulario">
                <label for="total">Quantidade Total</label>
                <input id="total" type="number" name="total" required placeholder="Insira a quantidade total...">
            </div>

            <div class="campo-formulario">
                <label for="manutencao">Necessita Manutenção</label>
                <input id="manutencao" type="number" name="manutencao" required placeholder="Quantas necessitam manutenção...">
            </div>

            <div class="modal-acoes">
                <button id="btn-cancelar" type="button" class="botao botao--secundario">Cancelar</button>
                <button id="btn-adicionar" type="submit" class="botao botao--primario">Adicionar</button>
            </div>
        </form>
    </div>

    <script src="estoque.js"></script>
</body>
</html>
