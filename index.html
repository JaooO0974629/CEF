<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEF</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/emprestimos.css">
</head>
<body>
    <header>
        <h1>CEF</h1>
        <nav>
            <ul>
                <li class="nav-ativo"><a href="index.html">Empréstimos</a></li>
                <li><a href="relatorios.html">Relatórios</a></li>
                <li><a href="estoque.html">Estoque</a></li>
                <li><a href="perfis.html">Perfis</a></li>
            </ul>
        </nav>
        <a href="login.html">
            <img class="logout" src="img/logout.png" alt="Sair">
        </a>
    </header>
    <main>
        <div class="top_buttons">
            <button id="btn-novo-emprestimo" class="botao botao--primario botao--largo">Novo Empréstimo</button>
            <input class="pesq" type="text" placeholder="Pesquisa...">
        </div>
        <div class="indicadores">
            <div class="indicador-card">
                <h2>Indicador</h2>
            </div>
            <div class="indicador-card">
                <h2>Indicador 2</h2>
            </div>
            <div class="indicador-card">
                <h2>Indicador 3</h2>
            </div>
            <div class="indicador-card">
                <h2>Indicador 4</h2>
            </div>
        </div>
        <div class="tabela-wrapper">
            <div class="tabela-card">
                <table class="tabela-emprestimos">
                    <thead>
                        <tr class="tabela-titulo">
                            <th>Empréstimos Ativos</th>
                        </tr>
                        <tr class="tabela-cabecalho">
                            <th>Ferramenta</th>
                            <th>Usuário</th>
                            <th>Setor</th>
                            <th>Data de Saída</th>
                            <th>Previsão de Devolução</th>
                        </tr>
                    </thead>
                    <tbody id="lista-emprestimos">
                        <tr>
                            <td>chave de fenda</td>
                            <td>joao</td>
                            <td>mpp3</td>
                            <td>hoje</td>
                            <td>amanha</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="modal-overlay" class="modal-overlay">
        <form id="form-novo-emprestimo" class="modal">
            <h2>Novo Empréstimo</h2><br>

            <div class="campo-formulario">
                <label for="ferramenta">Ferramenta</label>
                <input id="ferramenta" type="text" name="ferramenta" required placeholder="Insira a ferramenta...">
            </div>

            <div class="campo-formulario">
                <label for="usuario">Usuário</label>
                <input id="usuario" type="text" name="usuario" required placeholder="Insira o usuário...">
            </div>

            <div class="campo-formulario">
                <label for="setor">Setor</label>
                <input id="setor" type="text" name="setor" required placeholder="Insira o setor...">
            </div>

            <div class="campo-formulario">
                <label for="saida">Data de saída</label>
                <input id="saida" type="date" name="saida" required>
            </div>

            <div class="campo-formulario">
                <label for="devolucao">Data de devolução</label>
                <input id="devolucao" type="date" name="devolucao" required>
            </div>

            <div class="modal-acoes">
                <button id="btn-cancelar" type="button" class="botao botao--secundario">Cancelar</button>
                <button id="btn-adicionar" type="submit" class="botao botao--primario">Adicionar</button>
            </div>
        </form>
    </div>

    <script src="js/emprestimos.js"></script>
</body>
</html>
